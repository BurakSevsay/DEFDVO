name: defdvo
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - setuptools=80.10.2
  - eigen=5.0.1
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu130
    - --find-links https://data.pyg.org/whl/torch-2.10.0+cu130.html
    - torch==2.10.0
    - torchvision==0.25.0
    - torch-scatter==2.1.2
    - numpy==2.3.5
    - scipy==1.17.0
    - opencv-python==4.13.0.92
    - evo==1.34.3
    - yacs==0.1.8
    - tensorboard==2.20.0
    - matplotlib==3.10.8
